name: fatma_zahra_thyroid_tracker
description: Application Android hors ligne de suivi de l'hypothyroidie.
publish_to: "none"

# Pour changer de version : modifiez uniquement la ligne ci-dessous
# (1.0.0 = version affichee, +1 = numero de build, a augmenter a chaque version).
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.4
  fl_chart: 0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
