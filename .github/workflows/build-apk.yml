name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Le dossier android/ est genere automatiquement par Flutter (Gradle,
      # Kotlin et manifeste toujours compatibles avec la version de Flutter).
      - name: Generer le projet Android
        run: |
          if [ ! -d android ]; then
            mkdir -p /tmp/keep
            cp -r lib test assets tool pubspec.yaml analysis_options.yaml /tmp/keep/
            flutter create --platforms=android --org com.fatmazahra --project-name fatma_zahra_thyroid_tracker .
            rm -rf lib test assets tool pubspec.yaml analysis_options.yaml
            cp -r /tmp/keep/lib /tmp/keep/test /tmp/keep/assets /tmp/keep/tool /tmp/keep/pubspec.yaml /tmp/keep/analysis_options.yaml .
          fi
          sed -i 's/android:label="[^"]*"/android:label="FazTyroid"/' android/app/src/main/AndroidManifest.xml

      - name: Code natif (enregistrement dans Telechargements)
        run: |
          f=$(find android/app/src/main -name 'MainActivity.*' | head -n 1)
          dir=$(dirname "$f")
          pkg=$(grep -m1 '^package ' "$f")
          rm -f "$dir"/MainActivity.*
          { echo "$pkg"; cat tool/MainActivity.body.kt; } > "$dir/MainActivity.kt"
          cat "$dir/MainActivity.kt" | head -5

      - name: ML Kit (lecture de texte sur le telephone)
        run: |
          cp tool/proguard-rules.pro android/app/proguard-rules.pro
          if [ -f android/app/build.gradle.kts ]; then
            printf '\ndependencies {\n    implementation("com.google.mlkit:text-recognition:16.0.1")\n}\n' >> android/app/build.gradle.kts
            printf '\nandroid {\n    buildTypes {\n        getByName("release") {\n            proguardFiles("proguard-rules.pro")\n        }\n    }\n}\n' >> android/app/build.gradle.kts
            tail -16 android/app/build.gradle.kts
          else
            printf "\ndependencies {\n    implementation 'com.google.mlkit:text-recognition:16.0.1'\n}\n" >> android/app/build.gradle
            printf "\nandroid {\n    buildTypes {\n        release {\n            proguardFiles 'proguard-rules.pro'\n        }\n    }\n}\n" >> android/app/build.gradle
            tail -16 android/app/build.gradle
          fi

      - name: Icone FazTyroid
        run: |
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p android/app/src/main/res/mipmap-$d
            cp assets/icon/ic_launcher_$s.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Dependances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test --reporter expanded

      - name: APK release
        run: flutter build apk --release --no-shrink

      - name: Publier l'APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publier l'APK dans la Release (tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
